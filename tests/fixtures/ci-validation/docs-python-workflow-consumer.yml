name: Reusable Python test consumer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    uses: SanctumLabs/ci-workflows/.github/workflows/python-test.yml@v1.4.1
    with:
      packager: uv
      command: .venv/bin/python -m pytest
      upload-coverage: true
    secrets:
      codecov_token: ${{ secrets.CODECOV_TOKEN }}
