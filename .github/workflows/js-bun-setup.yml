# Used to run builds with bun as the package manager
name: Re-useable Bun Build Workflow

on:
  workflow_call:
    inputs:
      working-directory:
        description: Working Directory to use
        required: false
        default: /
        type: string
      command:
        description: Command to run for running builds
        required: true
        type: string
      bun-version:
        description: Bun Version to use
        default: '1.4.2'
        required: false
        type: string
      build-dir:
        description: Build directory that will be uploaded to artifacts
        default: build
        type: string
        required: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun 
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ inputs.bun-version }}

      - name: Run ${{ inputs.command }}
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.command }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build
          path: ${{ inputs.build-dir }}
