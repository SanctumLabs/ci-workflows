name: Re-useable Python Test Workflow

on:
  workflow_call:
    inputs:
      packager:
        description: "Supported package managers: poetry, uv."
        required: false
        default: poetry
        type: string
      command:
        description: Command to run for running tests
        required: true
        type: string
      python-version:
        description: Python Version to use
        default: '3.12'
        required: false
        type: string
      upload-coverage:
        description: Whether to upload coverage reports
        default: false
        required: false
        type: boolean

    secrets:
      codacy_token:
        description: 'Codacy Project token for uploading coverage to Codacy'
        required: false
      codecov_token:
        description: Codecov repository token for uploading coverage
        required: false

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Python packager
        uses: sanctumlabs/ci-workflows/.github/actions/validate-python-packager@main
        with:
          packager: ${{ inputs.packager }}

      # Ref: https://github.com/jenseng/dynamic-uses
      - name: Setup 
        uses: jenseng/dynamic-uses@8bc24f0360175e710da532c4d19eafdbed489a06 # v1.1.1
        with:
          uses: sanctumlabs/ci-workflows/.github/actions/setup-python-${{ inputs.packager }}@main
          with: '{ "python-version": "${{ inputs.python-version }}" }'

      - name: Run tests
        run: ${{ inputs.command }}

      - name: Upload Test coverage reports
        if: ${{ inputs.upload-coverage }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.codecov_token }}
          fail_ci_if_error: true

      - name: Check for Codacy Token Secret availability
        if: ${{ inputs.upload-coverage }}
        id: codacy-secret-check
        # perform secret check & put boolean result as an output
        shell: bash
        env:
          CODACY_PROJECT_TOKEN: ${{ secrets.codacy_token }}
        run: |
          if [ -n "$CODACY_PROJECT_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check Inadequate Permissions
        if: ${{ steps.codacy-secret-check.outputs.available != 'true' && inputs.upload-coverage }}
        # provide feedback for likely problem, note dependabot cannot access
        # secrets by default. Secondly, this step forces job to exit with a code of 0. This secret may be missing intentionally
        shell: bash
        env:
          ACTOR: ${{ github.actor }}
        run: |
          if [ "$ACTOR" = "dependabot[bot]" ]; then
            echo >&2 "Unable to access secrets as unprivileged dependabot.";
          else
            echo >&2 "Inadequate Permissions or missing secret value";
          fi
          exit 0
          
      - name: Run codacy-coverage-reporter
        if: ${{ steps.codacy-secret-check.outputs.available == 'true' && inputs.upload-coverage }}
        env:
          CODACY_PROJECT_TOKEN: ${{ secrets.codacy_token }}
        run: bash <(curl -Ls https://coverage.codacy.com/get.sh)
