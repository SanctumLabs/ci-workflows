# Used to run builds with package manager
name: Re-useable Python Build Workflow

on:
  workflow_call:
    inputs:
      packager:
        description: "Supported package managers: poetry, uv."
        required: false
        default: poetry
        type: string
      command:
        description: Command to run for running builds
        required: true
        type: string
      python-version:
        description: Python Version to use
        default: "3.12"
        required: false
        type: string
      install-command:
        description: Command to use to install dependencies
        default: "uv pip install -r pyproject.toml --all-extras"
        required: false
        type: string
      virtual-env-dir:
        description: Virtual environment directory
        default: ".venv"
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Python packager
        uses: sanctumlabs/ci-workflows/.github/actions/validate-python-packager@main
        with:
          packager: ${{ inputs.packager }}

      # Ref: https://github.com/jenseng/dynamic-uses
      - name: Setup
        uses: jenseng/dynamic-uses@8bc24f0360175e710da532c4d19eafdbed489a06 # v1.1.1
        with:
          uses: sanctumlabs/ci-workflows/.github/actions/setup-python-${{ inputs.packager }}@main
          with: '{ "python-version": "${{ inputs.python-version }}", "install-command": "${{ inputs.install-command }}", "virtual-env-directory": "${{ inputs.virtual-env-dir }}" }'

      - name: Run ${{ inputs.command }}
        run: ${{ inputs.command }}
