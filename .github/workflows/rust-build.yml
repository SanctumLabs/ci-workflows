name: Reusable Rust Build Workflow

on:
  workflow_call:
    inputs:
      rust-version:
        description: Rust version to use
        default: 'stable'
        type: string
        required: false
      profile:
        description: The profile to use
        default: 'release'
        type: string
        required: false        
      platform:
        description: Platform to run on
        default: 'ubuntu-latest'
        type: string
        required: false
      cache:
        description: whether to cache dependencies
        default: true
        type: boolean
        required: false
      working-directory:
        description: The working directory to run the build
        default: '.'
        type: string
        required: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ${{ inputs.platform }}
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

    - name: Build
      run: cargo build --profile ${{ inputs.profile }} --verbose
