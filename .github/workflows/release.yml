# Used when handling releases
# Uses https://github.com/softprops/action-gh-release
name: Re-useable Release Workflow

on:
  workflow_call:
    inputs:
      name:
        description: Release Name
        required: false
        type: string
      tag_name:
        description: Github Tag Name
        required: true
        type: string

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: ${{ inputs.name }}
          tag_name: ${{ inputs.tag_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
