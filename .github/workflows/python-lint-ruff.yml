#        packager: poetry

name: Reusable Python Lint Workflow with Ruff

on:
  workflow_call:
    inputs:
      packager:
        description: "Supported package managers: poetry, uv."
        required: false
        default: poetry
        type: string
      python-version:
        description: Python Version to use
        default: "3.14"
        required: false
        type: string
      ruff-version:
        description: Ruff version to use
        default: "0.16.3"
        required: false
        type: string
      directory:
        description: Source directory to lint
        default: "."
        required: false
        type: string
      ruff-args:
        description: Arguments to pass to ruff
        default: "check"
        required: false
        type: string
      changed-files:
        description: Whether to run on changed files alone
        default: "false"
        required: false
        type: string
      install-command:
        description: Command to use to install dependencies
        default: "uv pip install -r pyproject.toml --all-extras"
        required: false
        type: string
      virtual-env-dir:
        description: Virtual environment directory
        default: ".venv"
        required: false
        type: string

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Python packager
        uses: sanctumlabs/ci-workflows/.github/actions/validate-python-packager@main
        with:
          packager: ${{ inputs.packager }}

      # Ref: https://github.com/jenseng/dynamic-uses
      - name: Setup Python
        uses: jenseng/dynamic-uses@v1
        with:
          uses: sanctumlabs/ci-workflows/.github/actions/setup-python-${{ inputs.packager }}@main
          with: '{ "python-version": "${{ inputs.python-version }}", "install-command": "${{ inputs.install-command }}", "virtual-env-directory": "${{ inputs.virtual-env-dir }}" }'

      - name: Linting with Ruff
        uses: astral-sh/ruff-action@v4.1.0
        with:
          version: ${{ inputs.ruff-version }}
          src: ${{ inputs.directory }}
          args: ${{ inputs.ruff-args }}
          changed-files: ${{ inputs.changed-files }}
