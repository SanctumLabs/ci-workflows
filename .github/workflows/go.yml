name: Reuseable Go workflow

on:
  workflow_call:
    inputs:
        platform:
          description: Platform to run on
          default: 'ubuntu-latest'
          type: string
          required: false
        go-version:
          description: Go Version to use
          default: '1.25'
          type: string
          required: false
        cache:
          description: whether to cache dependencies
          default: true
          type: boolean
          required: false
        command:
          description: The command to run
          type: string
          required: true

jobs:
  runner:
    runs-on: ${{ inputs.platform }}
    steps:
      - name: Run Go command
        uses: SanctumLabs/ci-workflows/.github/actions/go@main
        with:
          command: ${{ inputs.command }}
          go-version: ${{ inputs.go-version }}
          cache: ${{ inputs.cache }}
