name: Reuseable Go lint Static Check workflow

on:
  workflow_call:
    inputs:
        platform:
          description: Platform to run on
          default: 'ubuntu-latest'
          type: string
          required: false
        go-version:
          description: Go Version to use
          default: '1.26'
          type: string
          required: false
        cache:
          description: whether to cache dependencies
          default: true
          type: boolean
          required: false
        cache-key:
          description: The cache key to use for static check
          default: ''
          type: string
          required: false  
        version:
          description: The version for static check
          default: 'latest'
          type: string
          required: false  

jobs:
  lint:
    runs-on: ${{ inputs.platform }}
    steps:
        - name: Checkout
          uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

        - name: Install Go
          uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
          with:
            go-version: ${{ inputs.go-version }}
            cache: ${{ inputs.cache }}

        - name: static check
          uses: dominikh/staticcheck-action@9716614d4101e79b4340dd97b10e54d68234e431 # v1.4.1
          with:
            version: ${{ inputs.version }}
            install-go: false
            cache-key: ${{ inputs.cache-key != '' && inputs.cache-key || runner.os }}
