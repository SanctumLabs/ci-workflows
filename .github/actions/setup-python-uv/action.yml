name: 'Setup Python UV'
description: 'Github Action for setting up Python with UV'

inputs:
  python-version:
    description: Version of Python to use
    required: false
    default: '3.12'

  uv-version:
    description: UV Version
    required: false
    default: latest

  enable-cache:
    description: Enable Caching
    required: false
    default: true

  cache-dependency-glob:
    description: Cache Glob
    required: false
    default: "uv.lock"

  virtual-env-directory:
    description: Virtual environment directory
    required: false
    default: .venv

  install-command:
    description: Command to install dependencies
    required: false
    default: uv pip install -r pyproject.toml --all-extras

runs:
  using: "composite"
  steps:
    #---------------------------#
    #       Set-up python       #
    #---------------------------#
    - name: Set up python ${{ inputs.python-version }}
      id: setup-python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ inputs.python-version }}

    #----------------------------------------#
    #       Install & configure UV           #            
    #----------------------------------------#
    - name: Load cached UV Binary
      id: cached-uv-binary
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.local
        key: uv-${{ runner.os }}-${{ inputs.uv-version }}-${{ hashFiles('uv.lock') }}
        restore-keys: |
            uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
            uv-${{ runner.os }}

    - name: Install UV
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        version: ${{ inputs.uv-version }}
        enable-cache: ${{ inputs.enable-cache }}
        cache-dependency-glob: ${{ inputs.cache-dependency-glob }}

    #----------------------------------------------------------#
    #       Install dependencies if cache does not exist       #
    #----------------------------------------------------------#
    - name: Install dependencies
      if: steps.cached-uv-dependencies.outputs.cache-hit != 'true'
      shell: bash
      run: |
        uv venv ${{ inputs.virtual-env-directory }}
        ${{ inputs.install-command }}